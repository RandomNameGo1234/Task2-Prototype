<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolsa Technology - Bookings.Products</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <div class="container">

        <header>
            <nav>
                <!--Navigation bar div button establishments for CSS-->
                <div class="HomeNavButton">
                    <a href="/index">
                        <img class="HomeButton" src="/static/Images/Untitled30_20250327010408.png" alt="Home Icon Button"></a></div>

                <div class="BookingsNavButton">
                    <a class="BookingsNavLinkText" href="/Bookings_ProductSelection">Bookings</a></div>

                <div class="EducationResourcesNavButton">
                    <a class="ERNavLinkText" href="/EducationalResourcesP1">Educational Resources</a></div>

                <div class="CarbFootprintNavButton">

                <div class="EnergyTrackerNavButton">
                    <a class="EnergyTrackerNavLinkText" href="/EnergyTracker">Energy usage tracker</a></div>
                                

                <!--Sign-up/Log-in & User profile navigation bar buttons for CSS-->
                <div class="Log-in-Sign-upNavButton">
                        <a class="Log_InNavLinkText" href="/Log_in">Log-In</a></div>
                <div class="UserProfileNavButton">
                        <a href="/User_profile">

            </nav>


            <div class="accent1"></div>
            <div class="accent2"></div>

        <main>

                </div>
                <div class="BoxIcon2">
                    <img src="/static/Images/ElectricVehicleCharging1.jpg" alt="Electrical Vechicle Charging Stations Icon">

                    </div>
                </div>
                <div class="BoxIcon3">
                    <img src="/static/Images/SmartHome1.jpg" alt="Smart home Bookings Icon">
                    <div class="BoxIconTags">
                        <a class="BookingIconLinks" href="/Bookings_Forms">Smart Home Installations<a>
                    </div>
                </div>
            </div>
        </main>
    
        <footer>
            <div class="BookingsFooter">

                <div class="accent3"></div>
                <div class="accent4"></div>
                
                <div class="BookingsFooterBox">
                    <a class="FooterConsultationLink" href="/Bookings_Forms">Feeling unsure? Click here for consultation!</a>
                </div>

            </div>
